<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流媒体解析 · 配置中心</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div><div class="eyebrow">流媒体聚合解析器</div><h1>流媒体解析 · 配置中心</h1></div>
    <div class="actions"><button id="reload" disabled>重新载入</button><button id="apply" disabled>应用已保存配置</button><button id="save" class="primary" disabled>保存并应用</button></div>
  </header>
  <div id="status" class="status" role="status" aria-live="polite">正在连接 AstrBot…</div>
  <div class="layout">
    <aside class="sidebar">
      <label class="search-label">搜索设置<input id="search" type="search" placeholder="平台、字号、代理…" disabled></label>
      <nav id="navigation" aria-label="配置分类"></nav>
      <section class="runtime"><h2>运行状态</h2><div id="runtime"></div><p class="muted">运行状态来自已加载配置，草稿预览即时更新。</p></section>
      <div class="file-actions"><button id="export" disabled>导出配置（不含凭据）</button><label class="file-label">导入配置<input id="import" type="file" accept=".json,application/json" disabled></label></div>
    </aside>
    <main>
      <div class="section-heading"><div><p class="eyebrow" id="section-kicker">PLATFORMS</p><h2 id="section-title">平台管理</h2></div><button id="reset" disabled>恢复本页默认值</button></div>
      <div id="editor"></div>
      <details id="changes-panel" class="panel"><summary id="changes-title">修改预览 · 0 项</summary><div id="changes"></div></details>
    </main>
    <aside class="preview panel">
      <div class="eyebrow">草稿即时预览</div><h2>消息示意</h2>
      <label>示例平台<select id="preview-platform" disabled></select></label>
      <label>预览缩放<select id="preview-scale"><option value="0.4">40%</option><option value="0.6" selected>60%</option><option value="0.8">80%</option><option value="1">100%</option></select></label>
      <p class="muted">展示字段与消息组合，不请求真实链接、不调用模型、不发送消息。图片为排版示意，实际字体和样式以机器人输出为准。</p>
      <div id="message-preview"></div>
      <div id="advice"></div>
    </aside>
  </div>
</body>
</html>
